name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, matching an existing tag
        required: true
        default: 1.0.2

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build-attest-publish:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use MAJOR.MINOR.PATCH."
          }

      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Validate tag and source version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Raw -LiteralPath 'Directory.Build.props'
          if ($props.Project.PropertyGroup.Version -ne $env:RELEASE_VERSION) {
            throw "Directory.Build.props version does not match the requested release."
          }
          $tag = "v$($env:RELEASE_VERSION)"
          $tagCommit = git rev-list -n 1 $tag
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) {
            throw "Checked-out source does not match tag '$tag'."
          }

      - name: Restore tools and dependencies
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet restore thymeme.slnx -r win-x64

      - name: Verify formatting
        run: dotnet format thymeme.slnx --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build thymeme.slnx --configuration Release --no-restore

      - name: Test Release
        run: dotnet test thymeme.slnx --configuration Release --no-build

      - name: Publish self-contained portable x64 application
        id: package
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'Thyme-Me-release'
          & ./eng/Build-PortableRelease.ps1 -Version $env:RELEASE_VERSION -OutputDirectory $outputRoot
          $releaseArchive = Join-Path $outputRoot "Thyme-Me-$($env:RELEASE_VERSION)-win-x64-portable.zip"
          $releaseSbom = Join-Path $outputRoot "portable\metadata\Thyme-Me-$($env:RELEASE_VERSION)-sbom.spdx.json"
          $releaseDirectory = Join-Path $outputRoot 'evidence'
          New-Item -ItemType Directory -Path $releaseDirectory | Out-Null
          Copy-Item -LiteralPath $releaseArchive,$releaseSbom -Destination $releaseDirectory
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $releaseArchive
          "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($hash.Path))" |
            Set-Content -Encoding utf8 -LiteralPath (Join-Path $releaseDirectory 'SHA256SUMS.txt')
          "archive=$releaseArchive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "directory=$releaseDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sbom=$releaseSbom" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$($hash.Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Attest portable archive provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attest portable archive SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: ${{ steps.package.outputs.sbom }}

      - name: Add attestation bundles to release evidence
        shell: pwsh
        run: |
          Copy-Item -LiteralPath '${{ steps.provenance.outputs.bundle-path }}' `
            -Destination (Join-Path '${{ steps.package.outputs.directory }}' "Thyme-Me-$($env:RELEASE_VERSION)-provenance.jsonl")
          Copy-Item -LiteralPath '${{ steps.sbom-attestation.outputs.bundle-path }}' `
            -Destination (Join-Path '${{ steps.package.outputs.directory }}' "Thyme-Me-$($env:RELEASE_VERSION)-sbom-attestation.jsonl")

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Thyme-Me-${{ inputs.version }}-unsigned-release
          path: ${{ steps.package.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$($env:RELEASE_VERSION)"
          if (gh release view $tag 2>$null) {
            throw "GitHub Release '$tag' already exists. Refusing to overwrite it."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Get-Content -Raw -LiteralPath "docs/release/versions/$tag.md" | Set-Content -Encoding utf8 -LiteralPath $notesPath
          @(
            ''
            '## Verify the portable ZIP'
            ''
            '```text'
            '${{ steps.package.outputs.sha256 }}  Thyme-Me-${{ inputs.version }}-win-x64-portable.zip'
            '```'
          ) | Add-Content -Encoding utf8 -LiteralPath $notesPath
          gh release create $tag '${{ steps.package.outputs.archive }}' `
            --verify-tag `
            --title "Thyme-Me $($env:RELEASE_VERSION)" `
            --notes-file $notesPath `
            --latest
