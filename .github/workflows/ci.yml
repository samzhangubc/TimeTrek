name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore thymeme.slnx
      - name: Build x64
        run: dotnet build thymeme.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test thymeme.slnx --configuration Release --no-build
      - name: Compile self-contained x64 app
        run: dotnet build src/ThymeMe.App/ThymeMe.App.csproj --configuration Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64
